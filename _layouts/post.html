---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.author %}
      <p class="post-meta">by {{ page.author }}</p>
    {% endif %}
    {% if page.date %}
      <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
    <footer class="post-footer">
      <div class="post-tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    </footer>
  {% endif %}
</article>

<style>
  .post {
    max-width: 800px;
    margin: 4rem auto;
    padding: 0 1rem;
  }

  .post-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .post-title {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }

  .post-meta {
    color: var(--text-color);
    opacity: 0.7;
    font-size: 0.95rem;
  }

  .post-content {
    line-height: 1.8;
    font-size: 1.05rem;
  }

  .post-content h2 {
    margin-top: 2rem;
  }

  .post-content p {
    margin-bottom: 1.5rem;
  }

  .post-content a {
    text-decoration: underline;
  }

  .post-footer {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 2px solid rgba(209, 113, 113, 0.2);
  }

  .post-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .tag {
    display: inline-block;
    background-color: rgba(219, 180, 74, 0.15);
    color: var(--primary-color);
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 500;
  }
</style>
