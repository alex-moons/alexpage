---
layout: default
---

<article class="page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
  </header>

  <div class="page-content">
    {{ content }}
  </div>
</article>

<style>
  .page {
    max-width: 900px;
    margin: 3rem auto;
    padding: 0 1rem;
  }

  .page-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .page-title {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }

  .page-content {
    line-height: 1.8;
    font-size: 1.05rem;
  }

  .page-content h2 {
    margin-top: 2rem;
    margin-bottom: 1rem;
  }

  .page-content p {
    margin-bottom: 1.5rem;
  }

  .page-content a {
    text-decoration: underline;
  }
</style>
